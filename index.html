<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Luana e João Henrique vão casar. Todas as informações da festa em um só lugar."
    />
    <meta name="theme-color" content="#0d0a09" />
    <script>
      // Aplica o tema antes da primeira pintura, para a página nunca nascer com o
      // tema errado. Chave e cores precisam bater com src/tema/tema.ts.
      ;(function () {
        try {
          var salvo = localStorage.getItem('casamento:tema')
          var escolhido = salvo === 'light' || salvo === 'dark' ? salvo : 'system'
          var escuro =
            escolhido === 'dark' ||
            (escolhido === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)

          document.documentElement.classList.toggle('dark', escuro)
          document.documentElement.style.colorScheme = escuro ? 'dark' : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', escuro ? '#0d0a09' : '#faf7f2')
        } catch {
          // Sem localStorage ou matchMedia: fica o tema claro do :root.
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..500&display=swap"
      rel="stylesheet"
    />
    <title>Luana e João Henrique</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
